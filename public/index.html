<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSLA — Village Saving and Loaning Association</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0d1117; color: #e6edf3; min-height: 100vh; overflow-x: hidden; }

        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            gap: 60px;
            position: relative;
            background: #0d1117;
        }

        .login-container {
            position: relative;
            width: 440px;
            padding: 40px;
            background: rgba(13, 17, 23, 0.95);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
        }

        .login-ring {
            position: absolute;
            top: -35px;
            left: -35px;
            right: -35px;
            bottom: -35px;
            border-radius: 50%;
            border: 3px dashed rgba(0, 242, 254, 0.3);
            animation: rotateRing 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-container h2 {
            font-size: 28px;
            font-weight: 600;
            color: #00f2fe;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .vsla-right-panel {
            max-width: 500px;
            z-index: 2;
            text-align: left;
        }

        .vsla-right-panel h1 {
            font-size: 48px;
            font-weight: 700;
            color: #00f2fe;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .vsla-right-panel h2 {
            font-size: 24px;
            font-weight: 500;
            color: #e6edf3;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .vsla-right-panel p {
            font-size: 16px;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .vsla-features {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vsla-feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #c9d1d9;
        }

        .vsla-feature-item span {
            color: #3fb950;
            font-weight: bold;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .forgot-pass {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-pass:hover { color: #00f2fe; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 8px;
            color: #0d1117;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .switch-auth {
            margin-top: 20px;
            font-size: 14px;
            color: #8b949e;
        }
        .switch-auth a {
            color: #00f2fe;
            text-decoration: none;
            font-weight: 500;
        }
        .switch-auth a:hover { text-decoration: underline; }

        .app-layout {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .nav-pane {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(13, 17, 23, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-brand {
            font-size: 22px;
            font-weight: 700;
            color: #00f2fe;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .nav-link {
            padding: 12px 16px;
            border-radius: 8px;
            color: #8b949e;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
        }

        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-profile-widget img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f2fe;
        }

        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px;
            max-width: calc(100vw - 260px);
        }

        .card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        th { color: #8b949e; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge.success { background: rgba(46, 160, 67, 0.2); color: #3fb950; }
        .badge.warning { background: rgba(210, 153, 34, 0.2); color: #d29922; }
        .badge.danger { background: rgba(248, 81, 73, 0.2); color: #f85149; }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-success { background: #2ea043; color: #fff; }
        .btn-success:hover { background: #2c974b; }
        .btn-danger { background: #f85149; color: #fff; }
        .btn-danger:hover { background: #da3633; }
        .btn-secondary { background: #30363d; color: #c9d1d9; }
        .btn-secondary:hover { background: #3c444d; }

        .chat-container { display: flex; flex-direction: column; height: 450px; background: #161b22; border-radius: 12px; border: 1px solid #30363d; overflow: hidden; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { background: #21262d; padding: 10px 14px; border-radius: 8px; max-width: 75%; }
        .chat-msg.mine { align-self: flex-end; background: #1f6feb; color: #fff; }
        .chat-input-area { display: flex; padding: 15px; background: #0d1117; border-top: 1px solid #30363d; gap: 10px; }
        .chat-input-area input { flex-grow: 1; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #fff; }

        .video-box { width: 100%; height: 350px; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid #30363d; overflow: hidden; }
        .video-overlay { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 6px; font-size: 13px; }

        .error-banner { background: rgba(248, 81, 73, 0.2); border: 1px solid #f85149; color: #f85149; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .success-banner { background: rgba(46, 160, 67, 0.2); border: 1px solid #3fb950; color: #3fb950; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div id="app"></div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let currentTheme = 'login';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        function initParticles(type) {
            particles = [];
            currentTheme = type;
            let count = type === 'member' ? 40 : 50;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    size: Math.random() * 3 + 1,
                    noteVal: [100, 200, 500, 1000][Math.floor(Math.random() * 4)]
                });
            }
        }
        initParticles('login');

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentTheme === 'admin') {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.arc(canvas.width - 120, 100, 50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(240, 240, 255, 0.9)';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
                ctx.shadowBlur = 0;
            } else if (currentTheme === 'group') {
                ctx.fillStyle = '#112218';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (currentTheme === 'member') {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#0d1117';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.save();
                ctx.translate(p.x, p.y);
                if (currentTheme === 'member') {
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
                    ctx.font = 'bold 13px Inter';
                    ctx.fillText(`KES ${p.noteVal}`, 0, 0);
                } else if (currentTheme === 'group') {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            requestAnimationFrame(animateBg);
        }
        animateBg();

        let currentUser = null;
        let systemOverview = null;
        let groupData = null;

        async function initApp() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                renderLogin(state);
            } catch (e) {
                console.error(e);
            }
        }

        async function renderLogin(state) {
            initParticles('login');
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="login-wrapper">
                    <!-- Left: Login Form -->
                    <div class="login-container">
                        <div class="login-ring"></div>
                        <h2>Login</h2>
                        <div id="authAlert"></div>
                        <form id="loginForm">
                            <div class="input-group">
                                <label>Email</label>
                                <input type="email" id="loginEmail" placeholder="codingstella@gmail.com" required>
                            </div>
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" id="loginPassword" placeholder="••••••••" required>
                            </div>
                            <div id="safeCodeGroup" class="input-group hidden">
                                <label>Safe Code (Required after 4 failed attempts)</label>
                                <input type="text" id="loginSafeCode" placeholder="Enter Safe Code">
                            </div>
                            <a href="#" class="forgot-pass" onclick="alert('Contact V-Super Admin for password reset / safe code.')">Forgot Password?</a>
                            <button type="submit" class="btn-primary">Login</button>
                        </form>
                        <div class="switch-auth">
                            Register: <a href="#" onclick="renderRegister()">V-Super Admin / Super Admin / Member Signup</a>
                        </div>
                    </div>

                    <!-- Right: VSLA Village Saving and loaning Association -->
                    <div class="vsla-right-panel">
                        <h1>VSLA</h1>
                        <h2>Village Saving and Loaning Association</h2>
                    </div>
                </div>
            `;

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const safeCode = document.getElementById('loginSafeCode').value;

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, safeCode })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        document.getElementById('authAlert').innerHTML = `<div class="error-banner">${data.error}</div>`;
                        if (data.error.includes('locked') || data.error.includes('Safe Code')) {
                            document.getElementById('safeCodeGroup').classList.remove('hidden');
                        }
                        return;
                    }
                    currentUser = data.user;
                    routeUserDashboard();
                } catch (err) {
                    alert('Error connecting to server.');
                }
            });
        }

        async function renderRegister() {
            initParticles('login');
            const res = await fetch('/api/state');
            const state = await res.json();

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="login-wrapper" style="padding: 40px 0;">
                    <div class="login-container" style="width: 500px;">
                        <h2>VSLA Registration</h2>
                        <p style="font-size: 13px; color: #8b949e; margin-bottom: 20px;">Register V-Super Admin, Super Admins (up to 2), or distant members (requires safe code).</p>
                        <div id="regAlert"></div>
                        <form id="regForm" enctype="multipart/form-data">
                            <div class="grid-2">
                                <div class="input-group">
                                    <label>First Name</label>
                                    <input type="text" id="regFirstName" required>
                                </div>
                                <div class="input-group">
                                    <label>Last Name</label>
                                    <input type="text" id="regLastName" required>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>Email</label>
                                <input type="email" id="regEmail" required>
                            </div>
                            <div class="input-group">
                                <label>Phone Number</label>
                                <input type="text" id="regPhone" required>
                            </div>
                            <div class="grid-2">
                                <div class="input-group">
                                    <label>Password</label>
                                    <input type="password" id="regPassword" required>
                                </div>
                                <div class="input-group">
                                    <label>Confirm Password</label>
                                    <input type="password" id="regConfirmPassword" required>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>Account Role</label>
                                <select id="regRole" onchange="toggleSafeCodeField()">
                                    ${!state.hasVSuperAdmin ? '<option value="v_super_admin">V-Super Admin (First Account - No Passcode)</option>' : ''}
                                    ${state.superAdminCount < 2 ? '<option value="super_admin">Super Admin (No Passcode)</option>' : ''}
                                    <option value="member">Member (Far away request - Requires Safe Code)</option>
                                </select>
                            </div>
                            <div class="input-group" id="safeCodeContainer">
                                <label>Safe Code</label>
                                <input type="text" id="regSafeCode" placeholder="Enter Safe Code (Members only)">
                            </div>
                            <div class="input-group">
                                <label>Profile Picture</label>
                                <input type="file" id="regProfilePic" accept="image/*">
                            </div>
                            <button type="submit" class="btn-primary">Register Account</button>
                        </form>
                        <div class="switch-auth">
                            Already have an account? <a href="#" onclick="initApp()">Login</a>
                        </div>
                    </div>
                </div>
            `;

            toggleSafeCodeField();

            document.getElementById('regForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData();
                formData.append('firstName', document.getElementById('regFirstName').value);
                formData.append('lastName', document.getElementById('regLastName').value);
                formData.append('email', document.getElementById('regEmail').value);
                formData.append('phone', document.getElementById('regPhone').value);
                formData.append('password', document.getElementById('regPassword').value);
                formData.append('confirmPassword', document.getElementById('regConfirmPassword').value);
                formData.append('roleSelection', document.getElementById('regRole').value);
                formData.append('safeCode', document.getElementById('regSafeCode').value);
                const fileInput = document.getElementById('regProfilePic').files[0];
                if (fileInput) formData.append('profilePic', fileInput);

                try {
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        document.getElementById('regAlert').innerHTML = `<div class="error-banner">${data.error}</div>`;
                        return;
                    }
                    alert('Registration successful! Please login.');
                    initApp();
                } catch (err) {
                    alert('Error during registration.');
                }
            });
        }

        function toggleSafeCodeField() {
            const role = document.getElementById('regRole').value;
            const container = document.getElementById('safeCodeContainer');
            if (role === 'member') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        async function routeUserDashboard() {
            if (currentUser.role === 'v_super_admin' || currentUser.role === 'super_admin') {
                initParticles('admin');
                await renderAdminDashboard();
            } else if (currentUser.role === 'group_admin') {
                initParticles('group');
                await renderGroupAdminDashboard();
            } else {
                initParticles('member');
                await renderMemberDashboard();
            }
        }

        async function renderAdminDashboard() {
            const res = await fetch('/api/admin/overview');
            systemOverview = await res.json();

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="app-layout">
                    <div class="nav-pane">
                        <div class="nav-brand">🏛️ VSLA Admin</div>
                        <div class="nav-links">
                            <a class="nav-link active" onclick="renderAdminDashboard()">📊 Overview & Groups</a>
                            <a class="nav-link" onclick="renderAdminUsers()">👥 All Users & Passwords</a>
                            <a class="nav-link" onclick="renderAdminNotes()">📝 V-Super Admin Notes</a>
                            <a class="nav-link" onclick="renderAdminLogs()">🔒 Security Logs & Filters</a>
                            <a class="nav-link" onclick="renderAdminReports()">📥 Download Reports</a>
                        </div>
                        <div class="user-profile-widget">
                            <img src="${currentUser.profilePic || '/uploads/default-avatar.png'}" alt="Profile">
                            <div>
                                <div style="font-weight:600; font-size:14px;">${currentUser.firstName}</div>
                                <div style="font-size:11px; color:#8b949e;">${currentUser.role.toUpperCase()}</div>
                            </div>
                        </div>
                        <button class="btn btn-danger" style="margin-top:15px;" onclick="logout()">Logout</button>
                    </div>

                    <div class="main-content">
                        <h2 style="margin-bottom:20px; color:#00f2fe;">${currentUser.role === 'v_super_admin' ? 'VSLA V-Super Admin (Full Owner Dashboard)' : 'VSLA Super Admin (Summary Dashboard)'}</h2>
                        
                        <div class="grid-4" style="margin-bottom:25px;">
                            <div class="card">
                                <h3>Total Groups</h3>
                                <p style="font-size:28px; font-weight:700; color:#00f2fe;">${systemOverview.totalGroups}</p>
                            </div>
                            <div class="card">
                                <h3>Total Members</h3>
                                <p style="font-size:28px; font-weight:700; color:#3fb950;">${systemOverview.totalMembers}</p>
                            </div>
                            <div class="card">
                                <h3>Total Savings (KES)</h3>
                                <p style="font-size:28px; font-weight:700; color:#d29922;">${systemOverview.totalSavings}</p>
                            </div>
                            <div class="card">
                                <h3>Total Loans Taken (KES)</h3>
                                <p style="font-size:28px; font-weight:700; color:#f85149;">${systemOverview.totalLoansTaken}</p>
                            </div>
                        </div>

                        <div class="card" style="margin-bottom:25px;">
                            <h3>Member Registration Page</h3>
                            <p style="font-size:18px; font-weight:600; color:${systemOverview.settings.registrationEnabled ? '#3fb950' : '#f85149'};">
                                ${systemOverview.settings.registrationEnabled ? 'ENABLED' : 'DISABLED'}
                            </p>
                            ${currentUser.role === 'v_super_admin' ? `<button class="btn btn-secondary" style="margin-top:10px;" onclick="toggleRegistration(!${systemOverview.settings.registrationEnabled})">Toggle Registration</button>` : ''}
                        </div>

                        <div class="card" style="margin-bottom:25px;">
                            <h3>Loan & Savings Detail (All Groups)</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Group Name</th>
                                        <th>Total Savings</th>
                                        <th>Total Loans</th>
                                        <th>Total Owed</th>
                                        <th>Pending (Group)</th>
                                        <th>Pending (V-Super)</th>

        // Lightweight client-side end-to-end encryption (XOR + Base64) for chat
        const VSLA_CIPHER_KEY = 'VSLA-E2E-SECURE-2026';
        function vslaXor(text) {
            let out = '';
            for (let i = 0; i < text.length; i++) {
                out += String.fromCharCode(text.charCodeAt(i) ^ VSLA_CIPHER_KEY.charCodeAt(i % VSLA_CIPHER_KEY.length));
            }
            return out;
        }
        function vslaEncrypt(plain) {
            try { return btoa(unescape(encodeURIComponent(vslaXor(plain)))); }
            catch (e) { return plain; }
        }
        function vslaDecrypt(b64) {
            try { return vslaXor(decodeURIComponent(escape(atob(b64)))); }
            catch (e) { return b64; }
        }

            await fetch('/api/group/member-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'edit', memberId, firstName, lastName, phone, email, password })
            });
            renderGroupAdminDashboard();
        }

        async function resetMemberPassword(memberId) {
            const newPassword = prompt('Enter new password for this member:');
            if (!newPassword) return;
            const res = await fetch('/api/group/member-reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ memberId, newPassword })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('Member password reset.');
            renderGroupAdminDashboard();
        }

        function toggleGroupLoanInputs() {
            const t = document.getElementById('gLoanType').value;
            if (t === 'cash') {
                document.getElementById('gLoanAmount').classList.remove('hidden');
                document.getElementById('gLoanItemId').classList.add('hidden');
            } else {
                document.getElementById('gLoanAmount').classList.add('hidden');
                document.getElementById('gLoanItemId').classList.remove('hidden');
            }
        }

        async function groupBorrowItem(itemId) {
            if (!confirm('Apply to borrow this item? (Requires V-Super Admin approval)')) return;
            const res = await fetch('/api/group/loan-apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ groupId: currentUser.groupId, requestedBy: currentUser.id, type: 'item', itemId })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('Item loan request sent to V-Super Admin for approval.');
            renderGroupLoans();
        }

        async function addFine(memberId) {
            const reason = prompt('Fine reason:');
            if (!reason) return;
            const amount = prompt('Fine amount (KES):');
            if (!amount) return;
            const res = await fetch('/api/group/fine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ groupId: currentUser.groupId, memberId, reason, amount })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('Fine added.');
            renderGroupMembersDetail();
        }

        async function payFine(fineId) {
            await fetch('/api/group/fine-pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fineId })
            });
            renderGroupMembersDetail();
        }

        async function saveWeekly(userId) {
            const amt = prompt('Enter weekly saving amount (KES 200 - 5500):');
            if (!amt) return;
            const res = await fetch('/api/savings/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, groupId: currentUser.groupId, amount: amt })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            alert('Weekly saving recorded (KES ' + amt + ').');
            if (currentUser.role === 'group_admin') renderGroupAdminDashboard();
            else renderMemberDashboard();
        }

        async function toggleRegistration(enabled) {
            await fetch('/api/admin/registration-toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            });
            renderAdminDashboard();
        }

        async function vSuperLoanAction(loanId, action) {
            await fetch('/api/admin/loan-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loanId, action })
            });
            alert('Loan ' + action + ' by V-Super Admin.');
            renderAdminDashboard();
        }

        async function resetUserPassword(userId) {
            const newPassword = prompt('Enter new password:');
            if (!newPassword) return;
            await fetch('/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, newPassword })
            });
            alert('Password reset!');
            renderAdminUsers();
        }

        async function deleteUser(userId) {
            if (!confirm('Delete user?')) return;
            await fetch('/api/admin/group-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'delete', adminId: userId })
            });
            renderAdminUsers();
        }

        function logout() {
            currentUser = null;
            initApp();
        }

        initApp();
    </script>
</body>
</html>
